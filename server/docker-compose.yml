services:
  rvc-update-server:
    build: .
    container_name: rvc-update-server
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aisound}
    volumes:
      - ./data:/app/data
    # MySQL 在宿主机时取消注释，并将 .env 中 MYSQL_HOST 设为 host.docker.internal
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
