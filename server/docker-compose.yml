services:
  aisound-server:
    build: .
    container_name: aisound-server
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aisound}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./auth:/app/auth
      - ./tools:/app/tools
      - ./main.py:/app/main.py
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # MySQL 在宿主机时取消注释，并将 .env 中 MYSQL_HOST 设为 host.docker.internal
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
